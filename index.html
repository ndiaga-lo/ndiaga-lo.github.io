<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>MEDNOTE</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f7f9;--cd:#fff;--tx:#15272e;--mu:#5d7480;--pr:#0b7285;--bd:#d9e3e8;--dg:#c92a2a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e191e;--cd:#172830;--tx:#e6eef2;--mu:#9bb0ba;--pr:#3bb5cc;--bd:#2b404a;--dg:#ff8787}}
:root[data-theme=dark]{--bg:#0e191e;--cd:#172830;--tx:#e6eef2;--mu:#9bb0ba;--pr:#3bb5cc;--bd:#2b404a;--dg:#ff8787}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
nav{position:sticky;top:0;z-index:5;display:flex;gap:4px;overflow-x:auto;background:var(--cd);border-bottom:1px solid var(--bd);padding:8px 10px}
nav b{color:var(--pr);margin-right:8px;align-self:center;letter-spacing:1px}
nav button{white-space:nowrap;border:0;background:none;color:var(--tx);padding:8px 10px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--pr);color:#fff}
main{max-width:980px;margin:0 auto;padding:14px}
.card,.item{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:0 0 10px}
.item{display:flex;gap:8px;align-items:flex-start}.grow{flex:1;cursor:pointer;min-width:0}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;margin:8px 0;font-size:13px;color:var(--mu)}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin-top:3px}
.btn{display:inline-block;background:var(--pr);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer;width:auto}
.btn.s{background:none;color:var(--pr);border:1px solid var(--pr)}.btn.dg,button.dg{color:var(--dg)}.btn.dg{background:none;border:1px solid var(--dg)}
.btn:disabled{opacity:.5}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row input{flex:1;min-width:140px;margin:0}
.mu{color:var(--mu);font-size:13px}.tag{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:0 8px;margin:2px 4px 0 0;font-size:12px}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:14px 0}
.big a{text-decoration:none;display:block}.big button,.big a{color:var(--tx);background:var(--cd);border:2px solid var(--pr);border-radius:14px;padding:22px;text-align:left;font:inherit;color:var(--tx);cursor:pointer}
.big span{font-size:34px;display:block}.big b{color:var(--pr)}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.st div{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px}.st b{font-size:24px;color:var(--pr);display:block}
.drop{border:2px dashed var(--pr);border-radius:14px;padding:40px 16px;text-align:center;background:var(--cd)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.mn{position:relative}.mn summary{cursor:pointer;list-style:none;padding:0 8px;font-size:20px}.mn>div{position:absolute;right:0;z-index:4;background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:4px;min-width:150px;display:flex;flex-direction:column}
.mn button{background:none;border:0;text-align:left;padding:7px 10px;font:inherit;color:var(--tx);cursor:pointer}
details details{margin-left:16px}summary{cursor:pointer;padding:4px 0}
.ov{position:fixed;inset:0;background:#0008;z-index:9;display:flex;align-items:center;justify-content:center;padding:14px}.ov>div{background:var(--cd);border-radius:14px;padding:18px;max-width:640px;width:100%;max-height:90vh;overflow:auto}
pre{white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:8px;font:inherit;font-size:13px}
.ai{border-left:4px solid var(--pr)}.or{border-left:4px solid var(--mu)}
#t{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;z-index:20;display:none}
h2{margin:6px 0 12px}.ov>div.w{max-width:900px}.doc{line-height:1.6}.doc img{max-width:100%}.doc table{border-collapse:collapse}.doc td,.doc th{border:1px solid var(--bd);padding:4px}
</style><script src="https://accounts.google.com/gsi/client" async defer></script></head><body><nav id="nv"></nav><main id="app"></main><div id="md"></div><div id="t"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Math.random().toString(36).slice(2,9);
const TYPES=['Topo','CAT','Présentation de malade','Fiche de révision','Protocole','Autre'],NT=['Visite','Staff','Cours au lit du malade','Enseignement','Observation','Autre'];
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),today=()=>new Date().toISOString().slice(0,10),fmt=d=>d?d.split('-').reverse().join('/'):'';
const parseTags=s=>String(s).split(',').map(x=>x.replace(/[#\s]/g,'')).filter(Boolean);
// Stockage : remplaçable par une vraie base (même interface load/save)
const store={load(){try{return JSON.parse(localStorage.getItem('mednote_v1'))}catch(e){return null}},save(d){try{localStorage.setItem('mednote_v1',JSON.stringify(d))}catch(e){toast('Stockage local indisponible ou plein')}}};
function seed(){const H=['Hôpital Saint-Jean de Dieu','Hôpital Régional de Thiès','Hôpital 10e','Hôpital Mame Abdou Aziz Sy Dabakh de Tivaouane'].map(n=>({id:uid(),name:n}));
const SV=[['Médecine interne','Chirurgie','Diabétologie','Cardiologie','DiabCardMed'],['Médecine interne','Chirurgie','Neurochirurgie','Pédiatrie','Gynécologie-obstétrique','Orthopédie','Cardiologie'],['Médecine interne','Chirurgie'],['Médecine interne','Chirurgie']];
const MI=['Infectiologie','Pneumologie','Maladies digestives','Néphrologie','Endocrinologie','Hématologie','Rhumatologie','Maladies auto-immunes','Cardiologie'],S=[],M=[];
H.forEach((h,i)=>SV[i].forEach(n=>{const s={id:uid(),h:h.id,name:n};S.push(s);(n=='Médecine interne'?MI:['Général']).forEach(m=>M.push({id:uid(),s:s.id,name:m}))}));return{H,S,M,docs:[],notes:[]}}
let D=store.load()||seed(),V='home',T='doc',A=null,N=null,M=null,Q='',AT=[],F={h:'',s:'',m:'',type:'',tag:'',from:''},G={h:'',s:''},SM=null,AS=null,DL=null,MC={},DE='';
const save=()=>store.save(D);if(D.drive===undefined)D.drive=true;
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const idb=new Promise(r=>{try{const q=indexedDB.open('mednote_files',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const fput=async(id,b)=>{const d=await idb;if(!d)return false;return new Promise(r=>{try{const t=d.transaction('f','readwrite');t.objectStore('f').put(b,id);t.oncomplete=()=>r(true);t.onerror=t.onabort=()=>r(false)}catch(e){r(false)}})};
const fget=async id=>{const d=await idb;if(!d)return null;return new Promise(r=>{try{const q=d.transaction('f').objectStore('f').get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})};
const fdel=async id=>{const d=await idb;if(d)try{d.transaction('f','readwrite').objectStore('f').delete(id)}catch(e){}};
if(window.claude){claude.use('sample').then(x=>SM=x).catch(()=>{});claude.use('assets').then(x=>AS=x).catch(()=>{});claude.use('downloads').then(x=>DL=x).catch(()=>{});claude.use('mcp').then(x=>MC=x).catch(()=>{})}
function toast(m){const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',3200)}
const nm=(L,id)=>(D[L].find(x=>x.id==id)||{}).name||'—',path=o=>[nm('H',o.h),nm('S',o.s),nm('M',o.m)].join(' › ');
const lab=(t,h)=>`<label>${t}${h}</label>`,inp=(v,c,t='text',ph='')=>`<input type=${t} value="${esc(v)}" placeholder="${esc(ph)}" oninput="${c}">`;
const sel=(o,v,c,ph)=>`<select onchange="${c}">${ph!=null?`<option value="">${ph}</option>`:''}${o.map(([a,b])=>`<option value="${a}"${a==v?' selected':''}>${esc(b)}</option>`).join('')}</select>`;
const hsm=(e,o,any)=>`<div class=g3>${lab('Hôpital',sel(D.H.map(x=>[x.id,x.name]),o.h,`setHSM(${e},'h',this.value)`,any?'Tous':'Choisir un hôpital'))}${lab('Service',sel(D.S.filter(x=>x.h==o.h).map(x=>[x.id,x.name]),o.s,`setHSM(${e},'s',this.value)`,any?'Tous':'Choisir un service'))}${lab('Module',sel(D.M.filter(x=>x.s==o.s).map(x=>[x.id,x.name]),o.m,`setHSM(${e},'m',this.value)`,any?'Tous':'Choisir un module'))}</div>`;
function setHSM(o,f,v){o[f]=v;if(f=='h'){o.s='';o.m=''}if(f=='s')o.m='';render()}
// Recherche sémantique locale (synonymes) + extension IA
const SYN=[['embolie pulmonaire','ep','thromboembolie pulmonaire','thromboembolie veineuse','tev','anticoagulation','aod','heparine'],['hta','hypertension','hypertension arterielle','urgence hypertensive'],['avc','accident vasculaire cerebral','ait'],['ira','insuffisance renale aigue'],['oap','oedeme aigu du poumon'],['hemorragie digestive','hda','hdb','saignement digestif'],['biermer','anemie de biermer','b12','macrocytose'],['diabete','dt2','dt1','glycemie']];
function expand(q){q=norm(q).trim();if(!q)return[];const t=new Set([q]);SYN.forEach(g=>{if(g.some(w=>q==w||(' '+q+' ').includes(' '+w+' ')||(q.length>3&&w.startsWith(q))))g.forEach(w=>t.add(w))});return[...t]}
const hit=(h,t)=>t.length<4?new RegExp('\\b'+t.replace(/[^a-z0-9 ]/g,'')+'\\b').test(h):h.includes(t);
const okF=(o,d)=>(!F.h||o.h==F.h)&&(!F.s||o.s==F.s)&&(!F.m||o.m==F.m)&&(!F.from||o.date>=F.from)&&(d?(!F.type||o.type==F.type)&&(!F.tag||o.tags.includes(F.tag)):!F.type&&!F.tag);
function runSearch(){const ts=[...expand(Q),...AT],m=h=>!ts.length||ts.some(t=>hit(norm(h),t));
return[...D.docs.filter(d=>okF(d,1)&&m([d.title,d.type,path(d),d.summary,d.kw.join(' '),d.tags.join(' '),d.text].join(' '))).map(o=>({k:'d',o})),...D.notes.filter(n=>okF(n,0)&&m([n.corr,n.raw,n.sujet,path(n),n.type].join(' '))).map(o=>({k:'n',o}))]}
async function doQ(ai){AT=[];if(ai&&Q&&SM){try{const r=await SM.json(`Donne des synonymes, abréviations et termes médicaux (français) liés à « ${Q} ». Réponds uniquement en JSON : {"termes":["..."]}`);AT=(r.termes||[]).map(norm)}catch(e){toast('Extension IA indisponible')}}render()}
const filters=()=>`<div class=card>${hsm('F',F,1)}<div class=g3>${lab('Type',sel(TYPES.map(t=>[t,t]),F.type,'F.type=this.value;render()','Tous'))}${lab('Tag',sel([...new Set(D.docs.flatMap(d=>d.tags))].map(t=>[t,'#'+t]),F.tag,'F.tag=this.value;render()','Tous'))}${lab('Depuis le',`<input type=date value="${F.from}" onchange="F.from=this.value;render()">`)}</div></div>`;
// Vues
const docRow=d=>`<div class=item><div class=grow onclick="openD('${d.id}','view')"><b>📄 ${esc(d.title)}</b><div class=mu>${esc(d.type)} · ${esc(path(d))} · ${fmt(d.date)}</div>${d.tags.map(t=>`<span class=tag>#${esc(t)}</span>`).join('')}</div><details class=mn><summary>⋮</summary><div>${[['Ouvrir','view'],['Modifier','edit'],['Déplacer','edit'],['Renommer','edit'],['Voir les informations','info'],["Voir l'analyse IA",'ai']].map(([l,m])=>`<button onclick="openD('${d.id}','${m}')">${l}</button>`).join('')}<button onclick="dl('${d.id}')">Télécharger</button><button onclick="dup('${d.id}')">Dupliquer</button><button class=dg onclick="askDel('${d.id}')">Supprimer</button></div></details></div>`;
const noteRow=n=>`<div class=item><details class=grow><summary><b>📝 ${esc(n.sujet||n.type)}</b> <span class=mu>${esc(n.type)} · ${esc(path(n))} · ${fmt(n.date)}</span></summary><div class="card or"><b>📝 Note originale</b><pre>${esc(n.raw)}</pre></div><div class=card><b>📚 Note corrigée et structurée</b><pre>${esc(n.corr)}</pre></div>${n.comp?`<div class="card ai"><b>🤖 Complément IA</b> <span class=mu>(non issu du médecin)</span><pre>${esc(n.comp)}</pre></div>`:''}</details><button class="btn dg" onclick="askDelN('${n.id}')">✕</button></div>`;
const empty='<p class=mu>Rien à afficher pour le moment.</p>';
function vHome(){const st=[['📁',D.docs.length,'Documents'],['📝',D.notes.length,'Notes de visite'],['🏥',D.H.length,'Hôpitaux'],['🩺',D.S.length,'Services'],['📚',D.M.length,'Modules']];
return`<div style="text-align:center"><h1 style="margin:6px;color:var(--pr)">MEDNOTE</h1><p class=mu>Ma bibliothèque médicale intelligente</p></div><div class=big><button onclick="T='doc';go('add')"><span>📁</span><b>AJOUTER UN DOCUMENT</b><div class=mu>Topo • CAT • Présentation</div></button><button onclick="T='note';go('add')"><span>📝</span><b>NOUVELLE NOTE DE VISITE</b><div class=mu>Corriger • Structurer</div></button><a href="${DRF?'https://drive.google.com/drive/folders/'+DRF:'https://drive.google.com/drive/my-drive'}" target=_blank rel=noopener><span>☁</span><b>OUVRIR MON DRIVE</b><div class=mu>Dossier MEDNOTE • ${D.docs.filter(d=>d.drive).length} fichier(s) sur Drive</div></a></div><div class=st>${st.map(s=>`<div>${s[0]}<b>${s[1]}</b>${s[2]}</div>`).join('')}</div><h3>Documents récents</h3>${D.docs.slice(0,5).map(docRow).join('')||empty}<h3>Notes récentes</h3>${D.notes.slice(0,5).map(noteRow).join('')||empty}`}
function tree(ds){return D.H.map(h=>{const a=ds.filter(d=>d.h==h.id);return a.length?`<details open><summary>🏥 <b>${esc(h.name)}</b> (${a.length})</summary>${D.S.filter(s=>s.h==h.id).map(s=>{const b=a.filter(d=>d.s==s.id);return b.length?`<details open><summary>📁 ${esc(s.name)}</summary>${D.M.filter(m=>m.s==s.id).map(m=>{const c=b.filter(d=>d.m==m.id);return c.length?`<details open><summary>📂 ${esc(m.name)}</summary>${c.map(docRow).join('')}</details>`:''}).join('')}</details>`:''}).join('')}</details>`:''}).join('')}
const vDocs=()=>`<h2>📁 Documents</h2>${filters()}${tree(D.docs.filter(d=>okF(d,1)))||empty}`;
const vNotes=()=>`<div class=row><h2 style="flex:1">📝 Notes de visite</h2><button class=btn onclick="T='note';go('add')">+ Nouvelle note</button></div>${filters()}${D.notes.filter(n=>okF(n,0)).map(noteRow).join('')||empty}`;
const vSearch=()=>`<h2>🔎 Recherche</h2><div class=row><input value="${esc(Q)}" placeholder="Rechercher dans ma bibliothèque..." oninput="Q=this.value" onkeydown="if(event.key=='Enter')doQ()"><button class=btn onclick="doQ()">Chercher</button>${SM?`<button class="btn s" onclick="doQ(1)">✨ Élargir avec l'IA</button>`:''}</div>${filters()}${(r=>`<p class=mu>${r.length} résultat(s)${AT.length?' · termes IA : '+esc(AT.join(', ')):''}</p>${r.map(x=>x.k=='d'?docRow(x.o):noteRow(x.o)).join('')||empty}`)(runSearch())}`;
const vAdd=()=>`<div class=tabs><button class="btn ${T=='doc'?'':'s'}" onclick="T='doc';render()">📁 Document</button><button class="btn ${T=='note'?'':'s'}" onclick="T='note';render()">📝 Note de visite</button></div>${T=='doc'?vAddDoc():vAddNote()}`;
function vAddDoc(){if(!A)return`<div class=drop ondragover="event.preventDefault()" ondrop="event.preventDefault();pick(event.dataTransfer.files[0])"><div style="font-size:42px">📁</div><h3>Glissez-déposez votre fichier ici</h3><p class=mu>PDF, DOC, DOCX, PPT, PPTX, TXT, JPG, JPEG, PNG</p><label class=btn style="color:#fff">Choisir un fichier<input type=file hidden accept=".pdf,.doc,.docx,.ppt,.pptx,.txt,.jpg,.jpeg,.png" onchange="pick(this.files[0])"></label></div>`;
if(A.step=='confirm')return vConfirm();const f=A.f;
return`<div class=card><b>📄 ${esc(A.file.name)}</b> <button class="btn s" onclick="A=null;render()">Changer</button>${lab('Type de document',sel(TYPES.map(t=>[t,t]),f.type,'A.f.type=this.value'))}${hsm('A.f',f)}<div class=g3>${lab('Date',inp(f.date,'A.f.date=this.value','date'))}${lab('Titre (laisser vide : proposé par l\'IA)',inp(f.title,'A.f.title=this.value'))}</div>${lab('Texte du document (optionnel, améliore l\'analyse ; les .txt sont lus automatiquement)',`<textarea rows=4 oninput="A.f.text=this.value">${esc(f.text)}</textarea>`)}${A.ext?'<p class=mu>Lecture du contenu du document…</p>':''}<button class=btn onclick="analyse()" ${A.busy||A.ext?'disabled':''}>${A.busy?'Analyse en cours…':'ANALYSER ET CLASSER'}</button></div>`}
function vConfirm(){const f=A.f,c=A.c,ai=A.ai;return`<div class=card><h3>Résumé du classement</h3>${lab('Titre',inp(c.title,'A.c.title=this.value'))}<p><b>Type :</b> ${esc(f.type)}<br><b>Emplacement :</b> ${esc(path(f))}<br><b>Date :</b> ${fmt(f.date)}</p>${lab('Nom du fichier',inp(c.filename,'A.c.filename=this.value'))}${lab('Tags (séparés par des virgules)',inp(c.tags,'A.c.tags=this.value'))}${c.summary?`<p><b>Résumé (IA) :</b> ${esc(c.summary)}</p>`:''}${c.kw.length?`<p><b>Mots-clés (IA) :</b> ${c.kw.map(esc).join(', ')}</p>`:''}${ai.module&&norm(ai.module)!=norm(nm('M',f.m))?`<p class=mu>🤖 Module suggéré par l'IA : ${esc(ai.module)}. Votre choix (${esc(nm('M',f.m))}) est conservé.</p>`:''}${ai.titre&&f.title.trim()&&norm(ai.titre)!=norm(f.title)?`<p class=mu>🤖 Titre suggéré : ${esc(ai.titre)} <button class="btn s" onclick="A.c.title=A.ai.titre;render()">Utiliser</button></p>`:''}${A.err?`<p class=mu>⚠ ${esc(A.err)}</p>`:''}<div class=row><button class=btn onclick="confirmDoc()">✓ CONFIRMER ET CLASSER</button><button class="btn s" onclick="A.step='form';render()">✎ MODIFIER</button></div></div>`}
function vAddNote(){N=N||newN();const f=N.f;if(N.step=='res')return`<div class="card or"><b>📝 Note originale</b><pre>${esc(f.raw)}</pre></div><div class=card><b>📚 Note corrigée et structurée</b> <span class=mu>(modifiable)</span><textarea rows=9 oninput="N.res.corrigee=this.value">${esc(N.res.corrigee)}</textarea>${lab('Sujet',inp(N.res.sujet,'N.res.sujet=this.value'))}${hsm('N.f',f)}</div><div class="card ai"><b>🤖 Complément IA</b> <span class=mu>Information générale de l'IA, pas des propos du médecin. À vérifier selon les recommandations en vigueur.</span><pre>${esc(N.res.complement||'[À compléter]')}</pre></div>${N.err?`<p class=mu>⚠ ${esc(N.err)}</p>`:''}<div class=row><button class=btn onclick="saveNote()">✓ CONFIRMER ET CLASSER</button><button class="btn s" onclick="N.step='';render()">✎ MODIFIER LA NOTE</button></div>`;
return`<div class=card>${hsm('N.f',f)}<div class=g3>${lab('Date',inp(f.date,'N.f.date=this.value','date'))}${lab('Type de note',sel(NT.map(t=>[t,t]),f.type,'N.f.type=this.value'))}</div>${lab('Notes',`<textarea rows=9 placeholder="Écrivez ou collez vos notes ici..." oninput="N.f.raw=this.value">${esc(f.raw)}</textarea>`)}<button class=btn onclick="orga()" ${N.busy?'disabled':''}>${N.busy?'Organisation en cours…':'🧠 ORGANISER MES NOTES'}</button></div>`}
const newN=()=>({f:{h:'',s:'',m:'',date:today(),type:'Visite',raw:''},step:''});
function vSet(){const L=(k,it,cur,ph,on)=>`<div class=card><div class=row><input id=a${k} placeholder="${ph}"><button class=btn onclick="add('${k}')">+</button></div>${it.map(x=>`<div class=row style="margin-top:6px"><input value="${esc(x.name)}" onchange="ren('${k}','${x.id}',this.value)">${on?`<button class="btn ${cur==x.id?'':'s'}" onclick="${on}='${x.id}';render()">›</button>`:''}<button class="btn dg" onclick="rm('${k}','${x.id}')">✕</button></div>`).join('')||'<p class=mu>Aucun élément.</p>'}</div>`;

async function toDrive(file,name,o){if(!D.drive)return null;const lg=x=>{D.dlog=[{name,size:file.size,...x},...(D.dlog||[])].slice(0,10);save()};
try{if(!file.size)throw{code:'fichier_vide',message:'fichier vide'};await rootId();let par=DRF;if(o)for(const x of[nm('H',o.h),nm('S',o.s),nm('M',o.m)])par=(await ensure(x,par))||par;
const ty=file.type||mt(name),t=await gtoken(),f='id,name,mimeType,size,webViewLink,webContentLink,parents';
const ini=await fetch(GA+'upload/drive/v3/files?uploadType=resumable&fields='+encodeURIComponent(f),{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json; charset=UTF-8','X-Upload-Content-Type':ty,'X-Upload-Content-Length':String(file.size)},body:JSON.stringify({name,parents:[par],mimeType:ty})});
if(!ini.ok)throw{code:'drive_'+ini.status,message:"initialisation de l'envoi refusée"};const url=ini.headers.get('Location');if(!url)throw{code:'location_absente',message:"adresse d'envoi non lisible (CORS)"};
let off=0,j=null;const CH=8*1024*1024;
while(!j){const end=Math.min(off+CH,file.size),r=await fetch(url,{method:'PUT',headers:{'Content-Range':`bytes ${off}-${end-1}/${file.size}`},body:file.slice(off,end)});
if(r.status==308){const rg=r.headers.get('Range');off=rg?+rg.split('-')[1]+1:end;continue}
if(!r.ok)throw{code:'drive_'+r.status,message:'échec du transfert à '+off+' o'};j=await r.json()}
const ok=String(j.size)==String(file.size);lg({dsize:j.size,mime:j.mimeType,id:j.id,view:j.webViewLink,web:j.webContentLink||'non fourni',count:1,ok});
if(!ok)toast('⚠ Taille Drive ('+j.size+') différente de la taille originale ('+file.size+')');
return{id:j.id,url:j.webViewLink}}catch(e){DE=(e.code||'erreur')+(e.message?' : '+String(e.message).slice(0,140):'');D.derr=DE;lg({err:DE,count:0});toast('Envoi vers Drive impossible ('+DE.slice(0,70)+')');return null}}
async function getBlob(d){const b=await fget(d.id);if(b)return b;if(d.asset){try{return await fetch(d.asset.url).then(r=>r.blob())}catch(e){}}
if(d.drive&&MC){try{const bs=[];for(const id of d.drive.parts||[d.drive.id]){const p=await dcall('download_file_content',{fileId:id});bs.push(unb64(p.content,'application/octet-stream'))}return new Blob(bs,{type:mt(d.filename)})}catch(e){}}return null}
async function pushOld(q){let n=0;for(const d of D.docs){if(d.drive&&!d.drive.parts)continue;const b=await getBlob(d);if(!b)continue;const r=await toDrive(b,d.filename,d,!!d.drive);if(r){if(d.drive&&d.drive.parts&&!r.parts)d.drive.parts.forEach(i=>dcall('trash_file',{fileId:i}).catch(()=>{}));d.drive=r;n++}}save();render();if(!q)toast(n+' document(s) envoyé(s) sur Drive')}
async function sendIndex(){toast("Envoi des documents puis de l'index…");await pushOld(1);const r=await toDrive(new Blob([JSON.stringify({...D,docs:D.docs.map(({text,...x})=>x)})],{type:'application/json'}),'mednote-index-'+today()+'.json');toast(r?'Index sauvegardé dans Drive':'Sauvegarde impossible')}
async function restoreIndex(){
try{await rootId();const p=await dcall('search_files',{query:`title contains 'mednote-index' and parentId = '${DRF}'`,excludeContentSnippets:true,pageSize:10});
const f=(p.files||[]).sort((a,b)=>String(b.createdTime).localeCompare(String(a.createdTime)))[0];if(!f)return toast('Aucun index trouvé dans le dossier MEDNOTE');
const x=await dcall('download_file_content',{fileId:f.id}),j=JSON.parse(await unb64(x.content,'application/json').text());let n=0;
for(const k of['H','S','M','docs','notes'])for(const o of j[k]||[])if(!D[k].some(y=>y.id==o.id)){D[k].push(o);if(k=='docs'||k=='notes')n++}
D.docs.sort((a,b)=>b.created-a.created);D.notes.sort((a,b)=>b.created-a.created);save();render();toast(n+' élément(s) ajouté(s) depuis '+f.title)}catch(e){toast('Restauration impossible ('+(e.code||'erreur')+')')}}
async function testDrive(){toast('Test en cours…');const out=[],H='%PDF-1.1\n1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 200 200]>>endobj\ntrailer<</Root 1 0 R>>\n%%EOF\n';
for(const[l,b,n]of[['petit fichier',new Blob(['test'],{type:'text/plain'}),'mednote-test.txt'],['gros PDF 1,3 Mo',new Blob([H,'%'.repeat(1.3e6)],{type:'application/pdf'}),'mednote-test.pdf']]){DE='';const r=await toDrive(b,n,null,1);out.push(l+' : '+(r?'OK':'échec'));if(r)dcall('trash_file',{fileId:r.id}).catch(()=>{})}D.dtest=out.join(' | ');save();render()}
async function dl(id){const d=D.docs.find(x=>x.id==id);try{const b=await getBlob(d);if(!b)return toast('Original indisponible (document ajouté avant cette version)');{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=d.filename;a.click()}}catch(e){toast('Téléchargement impossible')}}
const LK={H:'H',S:'S',M:'M'};
function add(k){const v=$('#a'+k).value.trim();if(!v)return;if(k=='H')D.H.push({id:uid(),name:v});else if(k=='S')D.S.push({id:uid(),h:G.h,name:v});else D.M.push({id:uid(),s:G.s,name:v});save();render()}
function ren(k,id,v){const x=D[k].find(o=>o.id==id);if(v.trim())x.name=v.trim();save();render()}
function rm(k,id){const used=[...D.docs,...D.notes].filter(o=>o[k.toLowerCase()]==id).length;if(used)return toast(used+' document(s)/note(s) utilisent cet élément : déplacez-les d\'abord');
if(k=='H'){D.S.filter(s=>s.h==id).forEach(s=>D.M=D.M.filter(m=>m.s!=s.id));D.S=D.S.filter(s=>s.h!=id);if(G.h==id)G={h:'',s:''}}if(k=='S'){D.M=D.M.filter(m=>m.s!=id);if(G.s==id)G.s=''}D[k]=D[k].filter(o=>o.id!=id);save();render()}
render();
